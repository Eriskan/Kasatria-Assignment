<!DOCTYPE html>
<html>
<head>
	<title>Kasatria Assignment - Data Visualization</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
	<link rel="stylesheet" href="style.css">
</head>
<body>

	<!-- LOGIN SCREEN -->
	<div id="login-screen">
		<div id="login-card">
			<h1>Welcome Back</h1>
			<p>Sign in with Google to view the data visualization</p>
			<div id="g_id_signin_container"></div>
			<div id="login-error">Sign-in failed. Please check the Client ID configuration.</div>
		</div>
	</div>

	<!-- LOADING SCREEN -->
	<div id="loading-screen">Loading data from Google Sheet...</div>

	<!-- MAIN APP -->
	<div id="app">
		<div id="info">Kasatria Assignment &mdash; Data Visualization (three.js css3d)</div>
		<div id="user-badge"></div>
		<div id="container"></div>
		<div id="legend">
			<span><span class="dot" style="background:#e74c3c;"></span>Net Worth &lt; $100K</span>
			<span><span class="dot" style="background:#f39c12;"></span>$100K &ndash; $200K</span>
			<span><span class="dot" style="background:#2ecc71;"></span>Net Worth &gt; $200K</span>
		</div>
		<div id="menu">
			<button class="ctrl" id="table">TABLE</button>
			<button class="ctrl" id="sphere">SPHERE</button>
			<button class="ctrl" id="helix">HELIX</button>
			<button class="ctrl" id="grid">GRID</button>
		</div>
	</div>

	<!-- ===================================================================
	     CONFIGURATION - EDIT THESE TWO VALUES BEFORE DEPLOYING
	     =================================================================== -->
	<script>
		// 1. Your OAuth 2.0 Client ID from Google Cloud Console
		//    (APIs & Services > Credentials > Create Credentials > OAuth client ID > Web application)
		//    Add your deployed URL (e.g. https://yourname.github.io) as an Authorized JavaScript origin.
		window.GOOGLE_CLIENT_ID = "1067331936836-b61qgbbgf53mm6sbcqut7g8fikud06r2.apps.googleusercontent.com";

		// 2. The published CSV link of your Google Sheet.
		//    In the Sheet: File > Share > Publish to web > select the sheet > CSV > Publish
		//    Paste the resulting link below.
		window.SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSZRxAIyU_Q09A9aOiibeLInIXMxVttt-h2sRepHtraya-PxpUZIEh32MN_nNFAYDbC7H-k5xWMID9V/pub?gid=2007307529&single=true&output=csv";
	</script>

	<script src="https://accounts.google.com/gsi/client" async defer></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

	<script type="importmap">
		{
			"imports": {
				"three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
				"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
			}
		}
	</script>
	<script type="module" src="script.js"></script>
</body>
</html>
